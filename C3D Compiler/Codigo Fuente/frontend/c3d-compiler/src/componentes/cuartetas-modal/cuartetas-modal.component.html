<div class="modal-backdrop-custom" (click)="onCerrar()"></div>

<div class="modal d-block" tabindex="-1" role="dialog" (click)="onCerrar()">
  <div
    class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable"
    (click)="$event.stopPropagation()"
  >
    <div class="modal-content bg-dark text-light">
      <div class="modal-header border-secondary">
        <h5 class="modal-title">
          <i class="bi bi-table me-2"></i>Cuartetas generadas

        </h5>
        <button
          type="button"
          class="btn-close btn-close-white"
          aria-label="Cerrar"
          (click)="onCerrar()"
        ></button>
      </div>

      <div class="modal-body p-0">
        @if (cuartetas().length > 0) {
          <table
            class="table table-dark table-striped table-hover table-sm mb-0 tabla-cuartetas"
          >
            <thead>
              <tr>
                <th class="text-center col-num">#</th>
                <th>Operador</th>
                <th>Arg 1</th>
                <th>Arg 2</th>
                <th>Resultado</th>
              </tr>
            </thead>
            <tbody>
              @for (c of cuartetas(); track $index) {
                <tr>
                  <td class="text-center text-light">{{ $index }}</td>
                  <td>{{ c.operador }}</td>
                  <td>{{ c.arg1 ?? "-" }}</td>
                  <td>{{ c.arg2 ?? "-" }}</td>
                  <td>{{ c.resultado ?? "-" }}</td>
                </tr>
              }
            </tbody>
          </table>
        } @else {
          <div class="text-center text-muted p-4">
            <i class="bi bi-inbox display-5 d-block mb-2"></i>
            No hay cuartetas para mostrar. Compila el código primero.
          </div>
        }
      </div>

      <div class="modal-footer border-secondary">
        <button type="button" class="btn btn-secondary" (click)="onCerrar()">
          Cerrar
        </button>
      </div>
    </div>
  </div>
</div>
