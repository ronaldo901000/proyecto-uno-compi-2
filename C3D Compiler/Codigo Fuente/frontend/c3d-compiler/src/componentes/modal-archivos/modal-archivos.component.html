<div class="modal-overlay" (click)="onCerrar()">
  <div class="modal-box" (click)="$event.stopPropagation()">
    
    <!-- Header Dinámico -->
    <div class="modal-header-custom d-flex justify-content-between align-items-center mb-3">
      <span class="fw-bold">
        @if (modo === 'crear') {
          {{ tipo === 'archivo' ? 'Nuevo archivo' : 'Nueva carpeta' }}
        } @else {
          {{ tipo === 'archivo' ? 'Renombrar archivo' : 'Renombrar carpeta' }}
        }
      </span>
      <button class="btn btn-sm btn-outline-secondary" (click)="onCerrar()">
        <i class="bi bi-x"></i>
      </button>
    </div>

    <!-- Input de Nombre -->
    <div class="mb-3">
      <label class="form-label small text-secondary">
        {{ modo === 'crear' ? 'Nombre' : 'Nuevo Nombre' }}
      </label>
      <input
        type="text"
        class="form-control form-control-sm bg-dark text-light border-secondary"
        [(ngModel)]="nombre"
        [placeholder]="tipo === 'archivo' ? 'miArchivo' : 'miCarpeta'"
        (keydown.enter)="nombre.trim() ? onConfirmar() : null"
        autofocus
      />
    </div>

    <!-- Selección de Extensión (Solo si es tipo archivo) -->
    @if (tipo === 'archivo' && modo !='editar') {
      <div class="mb-3">
        <label class="form-label small text-secondary">Extensión</label>
        <div class="d-flex gap-2">
          @for (ext of opcionesExtension; track ext) {
            <button
              type="button"
              class="btn btn-sm flex-grow-1"
              [class.btn-primary]="extension === ext"
              [class.btn-outline-secondary]="extension !== ext"
              (click)="extension = ext"
            >
              .{{ ext }}
            </button>
          }
        </div>
      </div>
    }

    <!-- Mensaje de Error -->
    @if (error) {
      <div class="alert alert-danger py-1 px-2 small mb-3">{{ error }}</div>
    }

    <!-- Botones de Acción -->
    <div class="d-flex gap-2 justify-content-end">
      <button class="btn btn-sm btn-outline-secondary" (click)="onCerrar()">
        Cancelar
      </button>
      <button 
        class="btn btn-sm btn-primary" 
        [disabled]="!nombre || !nombre.trim()" 
        (click)="onConfirmar()"
      >
        {{ modo === 'crear' ? 'Crear' : 'Guardar' }}
      </button>
    </div>

  </div>
</div>
